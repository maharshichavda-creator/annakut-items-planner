name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/android/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/capacitor.config.ts'
      - 'frontend/angular.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk annakut-planner-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: annakut-planner-debug-apk
          path: annakut-planner-debug.apk

      - name: Publish APK to the "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk annakut-planner-debug.apk --clobber
          else
            gh release create latest-apk annakut-planner-debug.apk \
              --title "Latest Android APK" \
              --notes "Debug APK built automatically by GitHub Actions from the latest main."
          fi
