spring:
  application:
    name: annakut-items-planner

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:1522}/${DB_NAME:annakut_planner}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Finastra}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: annakut
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: annakut
    default-schema: annakut
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    # Base64 encoded HMAC-SHA256 secret. Override via APP_JWT_SECRET env var in real deployments.
    secret: ${APP_JWT_SECRET:YW5uYWt1dC1pdGVtcy1wbGFubmVyLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    com.annakut.planner: INFO
