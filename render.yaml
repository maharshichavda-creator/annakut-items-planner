services:
  - type: web
    name: annakut-items-planner-backend
    runtime: docker
    repo: https://github.com/maharshichavda-creator/annakut-items-planner
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      # Reuses an existing Render Postgres; values are entered in the dashboard when the Blueprint is created.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        value: https://annakut-items-planner-frontend.onrender.com

  - type: web
    name: annakut-items-planner-frontend
    runtime: static
    repo: https://github.com/maharshichavda-creator/annakut-items-planner
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
