services:
  # --- Backend: Spring Boot REST API (Docker) ---
  - type: web
    name: annakut-items-planner-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      # Reuses the existing parasabha-planner-db (Render allows only one free Postgres).
      # Enter these in the dashboard; the app creates and uses its own "annakut" schema.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      # Must match the frontend's URL; update if Render assigns a different one.
      - key: APP_CORS_ORIGINS
        value: https://annakut-items-planner.onrender.com
      # Keep the JVM within the free plan's 512 MB limit.
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -XX:+UseSerialGC"

  # --- Frontend: Angular static site ---
  - type: web
    name: annakut-items-planner
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      # Angular 22's CLI requires Node >=22.22.3; Render's default Node is older.
      - key: NODE_VERSION
        value: "22.22.3"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
