<div class="login-page">
  <mat-card class="login-card">
    <div class="login-logo-wrap">
      <img src="assets/annakut-logo.png" alt="Annakut Mahotsav" class="login-logo" />
    </div>
    <mat-card-header>
      <mat-card-title>અન્નકૂટ મહોત્સવ વાનગી ફાળવણી</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput name="username" [(ngModel)]="username" required autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
