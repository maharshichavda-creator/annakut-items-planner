<mat-sidenav-container class="shell-container" autosize>
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? mobileOpen() : true"
    (closedStart)="mobileOpen.set(false)"
    class="shell-sidenav"
    [class.collapsed]="collapsed() && !isMobile()"
  >
    <div class="brand">
      <img src="assets/annakut-logo.png" alt="Annakut Mahotsav" class="brand-logo" />
      <div class="brand-text nav-label">
        <span>BAPS શ્રી સ્વામિનારાયણ મંદિર, પુણે</span>
      </div>
    </div>
    <mat-nav-list>
      @if (auth.isAdmin()) {
        <a mat-list-item routerLink="/users" routerLinkActive="active-link" (click)="onNavigate()" [matTooltip]="collapsed() && !isMobile() ? 'Users' : ''" matTooltipPosition="right">
          <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
          <span matListItemTitle class="nav-label">Users</span>
        </a>
        <a mat-list-item routerLink="/festival-years" routerLinkActive="active-link" (click)="onNavigate()" [matTooltip]="collapsed() && !isMobile() ? 'Festival Years' : ''" matTooltipPosition="right">
          <mat-icon matListItemIcon>event</mat-icon>
          <span matListItemTitle class="nav-label">Festival Years</span>
        </a>
      }
      <a mat-list-item routerLink="/items" routerLinkActive="active-link" (click)="onNavigate()" [matTooltip]="collapsed() && !isMobile() ? 'Items' : ''" matTooltipPosition="right">
        <mat-icon matListItemIcon>restaurant_menu</mat-icon>
        <span matListItemTitle class="nav-label">Items</span>
      </a>
      <a mat-list-item routerLink="/haribhakts" routerLinkActive="active-link" (click)="onNavigate()" [matTooltip]="collapsed() && !isMobile() ? 'Haribhakts' : ''" matTooltipPosition="right">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle class="nav-label">Haribhakts</span>
      </a>
      <a mat-list-item routerLink="/allocations" routerLinkActive="active-link" (click)="onNavigate()" [matTooltip]="collapsed() && !isMobile() ? 'Allocations' : ''" matTooltipPosition="right">
        <mat-icon matListItemIcon>assignment_turned_in</mat-icon>
        <span matListItemTitle class="nav-label">Allocations</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar">
      <button mat-icon-button (click)="toggleMenu()" aria-label="Toggle menu" matTooltip="Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <img src="assets/annakut-logo.png" alt="" class="toolbar-logo" />
      <span>અન્નકૂટ મહોત્સવ વાનગી ફાળવણી</span>
      @if (activeYear()) {
        <span class="year-badge">{{ activeYear()!.year }}</span>
      }
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>account_circle</mat-icon>
        {{ auth.username() }}
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="shell-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
